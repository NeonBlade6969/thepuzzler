<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL // CIPHER CHALLENGE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #050505;
            color: #e0e0e0;
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 700px;
            background: #0d0d0d;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .level-title {
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: #666;
            text-transform: uppercase;
        }

        .status {
            font-size: 0.8rem;
            color: #00ff66;
        }

        .prompt-area {
            min-height: 140px;
            margin-bottom: 25px;
        }

        .clue-box {
            background: #121212;
            border-left: 3px solid #fff;
            padding: 15px;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 15px;
            word-break: break-all;
        }

        .hint-text {
            font-size: 0.75rem;
            color: #555;
            margin-bottom: 10px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: #000;
            border: 1px solid #333;
            color: #fff;
            padding: 12px 15px;
            font-family: inherit;
            font-size: 0.9rem;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #666;
        }

        button {
            background: #fff;
            color: #000;
            border: none;
            padding: 0 20px;
            font-family: inherit;
            font-weight: 500;
            font-size: 0.85rem;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }

        button:hover {
            background: #ccc;
        }

        .shake {
            animation: shake 0.3s ease-in-out;
            border-color: #ff3333 !important;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        #reward-screen {
            display: none;
            text-align: center;
        }

        #reward-screen h2 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #fff;
        }

        #reward-screen a {
            color: #00ff66;
            text-decoration: underline;
            word-break: break-all;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container" id="game-box">
        <div class="header">
            <span class="level-title" id="level-indicator">Level 1 / 5</span>
            <span class="status">SYSTEM_ACTIVE</span>
        </div>

        <div id="puzzle-screen">
            <div class="prompt-area">
                <div class="clue-box" id="clue-display">Loading level...</div>
                <div class="hint-text" id="hint-display">Analysing output stream...</div>
            </div>

            <div class="input-group">
                <input type="text" id="answer-input" placeholder="Enter key..." autocomplete="off">
                <button onclick="submitAnswer()">SUBMIT</button>
            </div>
        </div>

        <div id="reward-screen">
            <h2>CHALLENGE COMPLETE</h2>
            <p style="margin-bottom: 20px; color: #888;">All 5 verification locks passed.</p>
            <p>Access Key / Resource:</p>
            <p style="margin-top: 10px;"><a href="#" id="reward-link">https://example.com/completion-reward</a></p>
        </div>
    </div>

    <script>
        // Puzzle Data Structure
        const levels = [
            {
                // Level 1: Reversed Morse Code -> "SIGNAL"
                // Standard Morse for SIGNAL: ... .. --. -. .- .-..
                // Reversed character sequence: .- ..-. -. --. .. ...
                clue: ".- ..-. -. --. .. ...",
                hint: "Instruction: Morse sequence detected in reverse transmission direction. Reverse the symbols before decoding.",
                answer: "SIGNAL"
            },
            {
                // Level 2: Reversed Morse decoded to "CODE", then Caesar Shift +3 -> "FRGH"
                clue: "..-. .-. --. ....",
                hint: "Instruction: Decoded string must undergo a Caesar Cipher shift of -3 to reveal the true keyword.",
                answer: "CODE"
            },
            {
                // Level 3: Base64 Encoded Text -> "SYSTEM" (Base64: U1lTVEVN)
                clue: "U1lTVEVN",
                hint: "Instruction: Standard 64-bit alphabet encoding detected.",
                answer: "SYSTEM"
            },
            {
                // Level 4: Scrabble Tile Value Sum
                // Word: "PUZZLE" -> P(3) + U(1) + Z(10) + Z(10) + L(1) + E(1) = 26
                clue: "P - U - Z - Z - L - E",
                hint: "Instruction: Calculate total numerical value using standard Scrabble tile point distribution.",
                answer: "26"
            },
            {
                // Level 5: Combined (Base64 of "LOCK" -> TE9DSw==, then Reversed -> ==wSDOT")
                clue: "==wSDOT",
                hint: "Instruction: Double-layer obfuscation. Reverse the string, then decode Base64.",
                answer: "LOCK"
            }
        ];

        let currentLevel = 0;

        function loadLevel() {
            if (currentLevel >= levels.length) {
                showReward();
                return;
            }

            document.getElementById("level-indicator").innerText = `Level ${currentLevel + 1} / ${levels.length}`;
            document.getElementById("clue-display").innerText = levels[currentLevel].clue;
            document.getElementById("hint-display").innerText = levels[currentLevel].hint;
            document.getElementById("answer-input").value = "";
        }

        function submitAnswer() {
            const inputField = document.getElementById("answer-input");
            const userAnswer = inputField.value.trim().toUpperCase();
            const correctAnswer = levels[currentLevel].answer.toUpperCase();

            if (userAnswer === correctAnswer) {
                currentLevel++;
                loadLevel();
            } else {
                inputField.classList.add("shake");
                setTimeout(() => {
                    inputField.classList.remove("shake");
                }, 300);
            }
        }

        function showReward() {
            document.getElementById("puzzle-screen").style.display = "none";
            document.getElementById("level-indicator").innerText = "COMPLETE";
            document.getElementById("reward-screen").style.display = "block";
        }

        // Allow pressing Enter to submit
        document.getElementById("answer-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                submitAnswer();
            }
        });

        // Initialize Level 1
        loadLevel();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>///</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .chamber {
            width: 420px;
            padding: 40px;
            background: #000;
            border: 1px solid #1a1a1a;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 0 80px rgba(255, 255, 255, 0.02);
            position: relative;
        }

        .status-header {
            font-size: 0.65rem;
            letter-spacing: 4px;
            color: #333;
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        /* Invisible text hidden on background - Select to view */
        .ghost-data {
            color: #000;
            font-size: 0.7rem;
            letter-spacing: 3px;
            margin-bottom: 25px;
            user-select: text;
        }

        .ghost-data::selection {
            background: #fff;
            color: #000;
        }

        .input-stack {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            background: #050505;
            border: 1px solid #1c1c1c;
            border-radius: 8px;
            padding: 14px;
            color: #fff;
            font-family: inherit;
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-align: center;
            outline: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            text-transform: uppercase;
        }

        input:focus {
            border-color: #555;
            background: #0a0a0a;
        }

        button {
            width: 100%;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-family: inherit;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        button:hover {
            background: #e6e6e6;
            transform: translateY(-1px);
        }

        /* Shaking on failure */
        .denied {
            animation: shake 0.35s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
            border-color: #444 !important;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* Mysterious Corner Beacon */
        .beacon {
            position: fixed;
            top: 24px;
            left: 24px;
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            opacity: 0;
            animation: pulseSignal 5.5s infinite;
        }

        /* Reversed SOS Timing Pattern */
        @keyframes pulseSignal {
            0%, 100% { opacity: 0; }
            2% { opacity: 1; } 4% { opacity: 0; }
            6% { opacity: 1; } 8% { opacity: 0; }
            10% { opacity: 1; } 12% { opacity: 0; }
            18% { opacity: 1; } 24% { opacity: 0; }
            28% { opacity: 1; } 34% { opacity: 0; }
            38% { opacity: 1; } 44% { opacity: 0; }
            50% { opacity: 1; } 52% { opacity: 0; }
            54% { opacity: 1; } 56% { opacity: 0; }
            58% { opacity: 1; } 60% { opacity: 0; }
        }

        /* Completion Screen */
        #resolved {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #fff;
            color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.2s ease;
        }

        #resolved.active {
            opacity: 1;
            pointer-events: all;
        }

        #resolved h1 {
            font-size: 2.5rem;
            letter-spacing: -1px;
            margin-bottom: 15px;
        }

        #resolved a {
            color: #000;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="beacon"></div>

    <div class="chamber" id="chamber-card" data-vault="S1VOTA==">
        <div class="status-header">Chamber Lockdown // 0x3F</div>
        
        <div class="ghost-data">Z - X - Q</div>

        <div class="input-stack">
            <input type="text" id="seq1" placeholder="• • •" maxlength="4" autocomplete="off">
            <input type="text" id="seq2" placeholder="• • •" maxlength="4" autocomplete="off">
            <input type="text" id="seq3" placeholder="• • •" maxlength="4" autocomplete="off">
        </div>

        <button onclick="evaluateLock()">Authenticate</button>
    </div>

    <div id="resolved">
        <h1>ACCESS GRANTED</h1>
        <a href="#" id="target-link" target="_blank">CONTINUE TO DESTINATION</a>
    </div>

    <script>
        const KEY_1 = "53";
        const KEY_2 = "JTLZ";
        const KEY_3 = "28";

        function evaluateLock() {
            const v1 = document.getElementById("seq1").value.trim();
            const v2 = document.getElementById("seq2").value.trim().toUpperCase();
            const v3 = document.getElementById("seq3").value.trim();

            const card = document.getElementById("chamber-card");

            if (v1 === KEY_1 && v2 === KEY_2 && v3 === KEY_3) {
                document.getElementById("resolved").classList.add("active");
            } else {
                card.classList.add("denied");
                setTimeout(() => {
                    card.classList.remove("denied");
                }, 400);
            }
        }
    </script>
</body>
</html>

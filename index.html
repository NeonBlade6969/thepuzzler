<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$100,000 IMPOSSIBLE PUZZLE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: background-color 1s ease;
        }

        /* Top Right Morse Beacon */
        #morse-beacon {
            position: absolute;
            top: 40px;
            right: 40px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #050505;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            transition: background-color 0.1s ease;
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 500px;
            padding: 40px;
            text-align: center;
            animation: fadeIn 1.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        h1 {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #666666;
            margin-bottom: 20px;
        }

        /* Smooth Loader */
        .loader-box {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 4px;
            margin-bottom: 40px;
            height: 30px;
            color: #ffffff;
        }

        #dots {
            display: inline-block;
            font-family: monospace;
            letter-spacing: 6px;
            font-weight: 700;
            transition: opacity 0.2s ease;
        }

        /* Stage Lock Indicators */
        .stage-indicator {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .dot-stage {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: 1px solid #ffffff;
            background: transparent;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .dot-stage.active {
            background: #ffffff;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
        }

        /* Input Form */
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid #333333;
            padding: 12px 0;
            font-size: 1.25rem;
            color: #ffffff;
            text-align: center;
            outline: none;
            letter-spacing: 4px;
            text-transform: uppercase;
            transition: border-color 0.3s ease;
        }

        input:focus {
            border-bottom-color: #ffffff;
        }

        /* Invisible Text Clue */
        .hidden-clue {
            color: #050505; /* Same as background */
            font-size: 0.75rem;
            margin-top: 30px;
            user-select: text;
            cursor: default;
            letter-spacing: 2px;
            transition: color 0.3s ease;
        }

        .hidden-clue::selection {
            background-color: #ffffff;
            color: #000000;
        }

        /* Error Vibration Animation */
        .shake {
            animation: smoothShake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        @keyframes smoothShake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Victory Screen */
        #victory-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            color: #000000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 1.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #victory-screen h2 {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 12px;
            margin-bottom: 10px;
        }

        #victory-screen p {
            font-size: 1rem;
            letter-spacing: 4px;
            color: #666666;
        }
    </style>
</head>
<body>

    <!-- Morse Light Beacon in Top Right Corner -->
    <div id="morse-beacon"></div>

    <div class="container" id="main-container">
        <h1>Challenge Lock System</h1>
        
        <div class="stage-indicator">
            <div class="dot-stage active" id="stg-1"></div>
            <div class="dot-stage" id="stg-2"></div>
            <div class="dot-stage" id="stg-3"></div>
        </div>

        <div class="loader-box">
            <span id="loader-label">SYNCING</span> <span id="dots">. . .</span>
        </div>

        <div class="input-group">
            <input type="text" id="passcode" placeholder="ENTER CODE" autocomplete="off" spellcheck="false" autofocus>
        </div>

        <!-- Hidden Clue (Highlight to see) -->
        <div class="hidden-clue">
            Caesar Shift -1 : QMBZ
        </div>
    </div>

    <!-- Victory Screen -->
    <div id="victory-screen">
        <h2>CHALLENGE CLEARED</h2>
        <p>YOU UNLOCKED THE VAULT</p>
    </div>

    <script>
        // Console Clues
        console.log("%c[SYSTEM INITIALIZED]", "color: #fff; font-weight: bold; font-size: 14px;");
        console.log("Hint 1: Loading sequence uses Binary (- is 1, . is 0).");
        console.log("Hint 2: Watch the top-right light beacon closely. It speaks in international code.");

        // Stage 1 Binary Sequence (5 - 2 - 6 - 1)
        const binarySequence = [
            "— . —", // 101 = 5
            ". — .", // 010 = 2
            "— — .", // 110 = 6
            ". . —"  // 001 = 1
        ];
        let seqIndex = 0;
        const dotsElement = document.getElementById("dots");

        setInterval(() => {
            dotsElement.style.opacity = '0';
            setTimeout(() => {
                dotsElement.innerText = binarySequence[seqIndex];
                dotsElement.style.opacity = '1';
                seqIndex = (seqIndex + 1) % binarySequence.length;
            }, 200);
        }, 2200);

        // Morse Code Transmitter for Beacon (SOS: ... --- ...)
        const beacon = document.getElementById("morse-beacon");
        const morsePattern = [
            100, 100, 100, 100, 100, 300, // S (...)
            300, 100, 300, 100, 300, 300, // O (---)
            100, 100, 100, 100, 100, 1200 // S (...)
        ];
        let morseIdx = 0;

        function runMorse() {
            const duration = morsePattern[morseIdx];
            const isOn = morseIdx % 2 === 0;
            beacon.style.backgroundColor = isOn ? "#ffffff" : "#050505";
            if (isOn) {
                beacon.style.boxShadow = "0 0 12px rgba(255, 255, 255, 0.9)";
            } else {
                beacon.style.boxShadow = "none";
            }
            
            morseIdx = (morseIdx + 1) % morsePattern.length;
            setTimeout(runMorse, duration);
        }
        runMorse();

        // Puzzle Lock Logic
        let currentStage = 1;
        const answers = {
            1: "5261",
            2: "SOS",
            3: "PLAY"
        };

        const input = document.getElementById("passcode");
        const container = document.getElementById("main-container");

        input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                const val = input.value.trim().toUpperCase();
                
                if (val === answers[currentStage]) {
                    // Correct Step
                    document.getElementById(`stg-${currentStage}`).classList.remove("active");
                    currentStage++;
                    
                    if (currentStage > 3) {
                        triggerVictory();
                    } else {
                        document.getElementById(`stg-${currentStage}`).classList.add("active");
                        input.value = "";
                        // Brief white flash on stage success
                        document.body.style.backgroundColor = "#1a1a1a";
                        setTimeout(() => document.body.style.backgroundColor = "#050505", 200);
                    }
                } else {
                    // Wrong Answer: Smooth shake animation
                    container.classList.add("shake");
                    input.style.borderBottomColor = "#ff3333";
                    setTimeout(() => {
                        container.classList.remove("shake");
                        input.style.borderBottomColor = "#333333";
                        input.value = "";
                    }, 500);
                }
            }
        });

        function triggerVictory() {
            const vic = document.getElementById("victory-screen");
            vic.style.display = "flex";
            setTimeout(() => {
                vic.style.opacity = "1";
            }, 50);
        }
    </script>
</body>
</html>
